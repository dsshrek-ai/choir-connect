<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program | Choir Connect</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>Choir Connect</h1>
  <nav class="site-nav" id="site-nav"></nav>
  <div id="choir-picker" class="choir-picker"></div>
</header>
<main id="main-content">
  <p><a href="programs.html">&larr; Back to Rehearsal Tracks</a></p>
  <div id="content">Loading program&hellip;</div>
</main>
<footer class="site-footer">Choir Connect</footer>
<script src="js/api.js"></script>
<script>
  (async () => {
    const el = document.getElementById('content');
    const program = new URLSearchParams(window.location.search).get('program');
    if (!program) {
      el.innerHTML = `<p class="placeholder-note">No program selected.</p>`;
      return;
    }
    try {
      await captureSsoEmail();
      await ensureActiveChoir();
      const data = await fetchChoirData('program', { program });
      const songs = data.Songs || [];
      el.innerHTML = `
        <h2>${escapeHtml(data.ProgramName || 'Program')}</h2>
        <p class="song-part-desc">Pick a song to hear its part tracks.</p>
        ${songs.length === 0 ? `<p class="placeholder-note">No songs have been added to this program yet.</p>` : `
          <ul class="program-list">
            ${songs.map(s => `
              <li>
                <a href="song.html?program=${encodeURIComponent(program)}&song=${encodeURIComponent(s.SongNumber)}">
                  ${escapeHtml(s.SongTitle || ('Song ' + s.SongNumber))}
                </a>
              </li>
            `).join('')}
          </ul>
        `}
      `;
    } catch (e) {
      handleFetchError(el, e);
    }
  })();
</script>
</body>
</html>
