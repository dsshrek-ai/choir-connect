<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule | Choir Connect</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>Choir Connect</h1>
  <nav class="site-nav" id="site-nav"></nav>
  <div id="choir-picker" class="choir-picker"></div>
</header>
<main id="main-content">
  <h2>Schedule</h2>
  <p class="song-part-desc">Upcoming rehearsals and events, soonest first. Past events are listed below the line.</p>
  <div id="content">Loading schedule&hellip;</div>
</main>
<footer class="site-footer">Choir Connect</footer>
<script src="js/api.js"></script>
<script>
  function fmtDate(d) {
    if (!d) return '';
    const parts = String(d).split('-').map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return d;
    const dt = new Date(parts[0], parts[1] - 1, parts[2]);
    return dt.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  // 'YYYY-MM-DD' -> true if strictly before today (local).
  function isPast(d) {
    if (!d) return false;
    const today = new Date();
    const t = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    return String(d) < t;
  }

  function entryCard(e) {
    const past = isPast(e.Date);
    const when = [fmtDate(e.Date), e.Time].filter(Boolean).join(' · ');
    const locationHtml = e.Location
      ? (e.MapLink
          ? `<a href="${escapeHtml(e.MapLink)}" target="_blank" rel="noopener">${escapeHtml(e.Location)}</a>`
          : escapeHtml(e.Location))
      : '';
    return `
      <div class="card sched-card${past ? ' sched-past' : ''}">
        <h3>${escapeHtml(e.Title || 'Event')}</h3>
        ${when ? `<p class="sched-when">${escapeHtml(when)}</p>` : ''}
        ${locationHtml ? `<p class="sched-loc">📍 ${locationHtml}</p>` : ''}
        ${e.Instructions ? `<div class="sched-block"><strong>Entry instructions</strong>${formatText(e.Instructions)}</div>` : ''}
        ${e.Notes ? `<div class="sched-block">${formatText(e.Notes)}</div>` : ''}
      </div>
    `;
  }

  (async () => {
    const el = document.getElementById('content');
    try {
      await captureSsoEmail();
      await ensureActiveChoir();
      const entries = await fetchChoirData('schedule');
      if (!Array.isArray(entries) || entries.length === 0) {
        el.innerHTML = `<p class="placeholder-note">Nothing on the schedule for this choir yet.</p>`;
        return;
      }
      // Earliest to latest. Undated entries aren't past, so they close out the
      // upcoming list; past events go below a heavy line. The sort is stable, so
      // entries on the same date keep the order they were entered in.
      const byDate = (a, b) => String(a.Date).localeCompare(String(b.Date));
      const upcoming = entries.filter(e => e.Date && !isPast(e.Date)).sort(byDate);
      const undated = entries.filter(e => !e.Date);
      const past = entries.filter(e => e.Date && isPast(e.Date)).sort(byDate);

      let html = upcoming.concat(undated).map(entryCard).join('')
        || `<p class="placeholder-note">Nothing coming up right now.</p>`;
      if (past.length) {
        html += `<hr class="sched-rule"><p class="sched-divider">Past events</p>${past.map(entryCard).join('')}`;
      }
      el.innerHTML = html;
    } catch (e) {
      handleFetchError(el, e);
    }
  })();
</script>
</body>
</html>
